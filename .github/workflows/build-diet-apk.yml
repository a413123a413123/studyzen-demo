name: Build DietZen APK

# 這個 repo 的開發環境連不到 dl.google.com，裝不了 Android SDK，
# 所以 APK 一律在 GitHub 的 runner 上編譯（runner 內建 Android SDK）。
on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'diet/**'
      - 'android/**'
      - '.github/workflows/build-diet-apk.yml'

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('android/**/*.gradle', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        id: rename
        working-directory: android
        run: |
          VERSION=$(grep -m1 'versionName' app/build.gradle | sed 's/.*"\(.*\)".*/\1/')
          OUT="DietZen-${VERSION}-$(date -u +%Y%m%d).apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$OUT"
          echo "apk=android/$OUT" >> "$GITHUB_OUTPUT"
          ls -lh "$OUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DietZen-apk
          path: ${{ steps.rename.outputs.apk }}
          if-no-files-found: error
          retention-days: 90
